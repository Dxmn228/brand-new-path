<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Alice&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="enter_user.css">
    <link rel="stylesheet" href="registration_user.css">
    <title>Лучший сайт для покупки билетов и продвижения экскурсий</title>
</head>
<body>
    <div class="header">
        <img src="visual elements for main page/header_white.svg">
        <p class="header new_path">Новый путь</p>
        <div id="auth_controls">
            <p class="header enter">войти</p>
            <img src="visual elements for main page/body_of_profile.svg" class="header body_of_profile" alt="">
            <img src="visual elements for main page/head_of_profile.svg" class="header head_of_profile" alt="">
            <button type="button" class="enter_user" onclick="open_user_window()" aria-label="Вход и регистрация"></button>
        </div>
    </div>
    <div id="user_window" class="user_window">
        <p class="background"></p>
        <p class="exit">Выйти</p>
        <div class="log_in">
            <p class="log_in_enter">Вход</p>
            <p class="log_in_text">Войдите в профиль с помощью email или телефона (на выбор) и пароля</p>
            <form id ="login-form">
            <input
                type="text"
                name="identifier"
                placeholder="Email или номер телефона"
                class="log_in_email_or_phone_number"
                autocomplete="username"
                required
            >
            <input
                type="password"
                name="password"
                placeholder="Пароль"
                class="log_in_password"
                autocomplete="current-password"
                required
            >
            <button type="submit" class="log_in_submit">Войти</button>
            <p id="login-message" role="status"></p>
            </form>
        </div>
        <div class="registration">
            <p class="registration_task">Регистрация</p>
            <p class="registration_text">Зарегестрируйте свой профиль, используя свое имя, email и номер телефона</p>
            <form id="registration-form" method="post">
            <input
                type="text"
                name="full_name"
                placeholder="Ваше имя"
                class="registration_name"
                autocomplete="name"
                minlength="1"
                maxlength="25"
                required
            >
            <input
                type="email"
                name="email"
                placeholder="Ваш email"
                class="registration_email"
                autocomplete="email"
                required
            >
            <input
                type="tel"
                name="phone"
                placeholder="+79991234567"
                class="registration_phone"
                autocomplete="tel"
                pattern="\+7[0-9]{10}"
                minlength="12"
                maxlength="12"
                required
            >
            <p class="password_first">Введите пароль в первом поле и повторите во втором</p>
            <input
                type="password"
                name="password"
                placeholder="Введите свой пароль"
                class="registration_password"
                autocomplete="new-password"
                minlength="8"
                required
            >
            <input
                type="password"
                name="password_confirm"
                placeholder="Повторите свой пароль"
                class="repeat_password"
                autocomplete="new-password"
                minlength="8"
                required
            >
            <button type="submit" class="registration_submit">Зарегистрироваться</button>
            <p id="registration-message" role="status" aria-live="polite"></p>
            </form>
        </div>
        <button class="exit_button" onclick="close_user_window()"></button>
    </div>
</body>
</html>
