version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: studyhub-db
    environment:
      POSTGRES_USER: studyhub_user
      POSTGRES_PASSWORD: studyhub_password
      POSTGRES_DB: studyhub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyhub_user -d studyhub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: studyhub-backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db  # Имя сервиса 'db' внутри Docker-сети
      - POSTGRES_USER=studyhub_user
      - POSTGRES_PASSWORD=studyhub_password
      - POSTGRES_DB=studyhub_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app  # Монтируем код для горячей перезагрузки
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: